asyncapi: 3.0.0
info:
  title: ScanSolo Operação Centralizada — async contract delta (CT-03, CT-04, CT-05, CT-06, CT-07, native events)
  version: "1.5.0"
  description: >
    Delta over `.spec/features/scansolo-production-complete/asyncapi.yaml` (v1.2.0) and
    `.spec/features/scansolo-agent-qualification-continuity/asyncapi.yaml` (v1.3.0,
    `qualification` key set). Channels listed here are NEW or CHANGED by SPEC
    `scansolo-operacao-centralizada` v1.2; everything else of the prior contracts is unchanged.

    COMPAT notes:
    (1) CT-05 — the request envelope, transport (`Authorization: Bearer`,
    `X-Idempotency-Key`, verified at `app/services/scan_solo/make/outbound_request_service.rb:83-91`)
    and every existing payload field are unchanged. Additive: `proposal_number`,
    `commercial` (RF-24, RF-26) and `qualification.projeto` (cliente_final value, kept
    because the current `Entrada` reads it for `{{PROJETO_CLIENTE_FINAL}}`).
    `commercial.total_value_in_words` is part of CT-05 v1.3 (RF-47: generated by Rails,
    deterministic, never by AI; the Entrada uses it as received). The emitted `action` narrows to `proposal.generate` only (RF-55: no
    flow emits `proposal.send`); a narrower producer does not break the Make consumer.
    (2) CT-06 — schema identical to `ScanSolo::Make::CallbackVerifier::SCHEMA`
    (`app/services/scan_solo/make/callback_verifier.rb:12-56`); no field added.
    `proposal.send` callbacks stay accepted (historical). Semantics change only:
    `artifact_url` of `proposal.generate` is the download source fetched by Rails
    (RF-48, never sent to the customer) and `valid_until` is now persisted (RF-26).
    (3) Native events — `scansolo_origin` gains `manual_lead`, `quote_notice`,
    `proposal_follow_up` (additive).
    (4) v1.5.0 (SPEC v1.3): the commercial recipient of CT-03/CT-07 e-mails is the published
    config field `quote_recipient_email` (RF-54, initial value `comercial@scansolo.com.br`),
    no longer a fixed value; CT-03 also covers the manual resend (RF-56, same thread and
    correlation id).
    (5) Protocol values `smtp` (Chatwoot native e-mail inbox) and `wisper` (in-process
    bus) are not in the AsyncAPI registered list; they follow the `wisper` precedent of
    the prior ScanSolo contracts and are documentation-only.
servers:
  make:
    host: "{makeScenarioHost}"
    protocol: https
    description: >
      Make scenario webhook (`ScanSOLO_Proposta_Entrada`). URL and bearer secret come only
      from Rails credentials `scan_solo.make.scenario_url` / `scan_solo.make.secret` (HG-03).
    variables:
      makeScenarioHost:
        default: hook.make.example
    security:
      - $ref: '#/components/securitySchemes/makeOutboundAuth'
  scanSoloWebhooks:
    host: "{scanSoloHost}"
    protocol: https
    description: ScanSolo inbound callback receiver (`Webhooks::ScanSolo::MakeController`).
    variables:
      scanSoloHost:
        default: app.scansolo.local
    security:
      - $ref: '#/components/securitySchemes/makeInboundSignature'
  chatwootEmailInbox:
    host: "{quoteInboxHost}"
    protocol: smtp
    description: >
      The Chatwoot native e-mail inbox configured as the account's quote inbox
      (`AiAgentConfig#quote_inbox_id`, RF-54; HG-A: `atendimento.comercial@scansolo.com.br`).
      Outbound through `Message` → `SendReplyJob` → `Email::SendOnEmailService` →
      `ConversationReplyMailer#email_reply`; inbound through IMAP polling (1 min,
      `config/schedule.yml:24-27`) or ActionMailbox, threaded by
      `Mailbox::ConversationFinder` (`In-Reply-To`/`References`). Never in
      `allowed_inbox_ids` (RF-16).
    variables:
      quoteInboxHost:
        default: mail.scansolo.com.br
  chatwootEventBus:
    host: in-process
    protocol: wisper
    description: >
      Internal Chatwoot dispatcher (`AsyncDispatcher` → `ScanSolo::ConversationListener`)
      and the in-process ScanSolo notification publisher. Not network-exposed.

channels:
  makeIntegrationRequest:
    address: /scenario-webhook
    servers:
      - $ref: '#/servers/make'
    description: Outbound proposal generation request (CT-05; RF-24, RF-26, RF-47).
    messages:
      makeIntegrationRequest:
        $ref: '#/components/messages/MakeIntegrationRequest'

  makeIntegrationCallback:
    address: /webhooks/scan_solo/make
    servers:
      - $ref: '#/servers/scanSoloWebhooks'
    description: >
      Inbound signed callback (CT-06). Order unchanged: HMAC over raw body → JSON parse →
      schema → MakeRequest match. A valid `proposal.generate` success applied by
      `ScanSolo::Proposal::CallbackHandler` sets `generated`, `value`, `currency`,
      `artifact_url` and `valid_until`; after commit, `ProposalDeliveryJob` downloads the
      PDF from `artifact_url` into ActiveStorage and sends the proposal template (RF-29).
      A failure keeps the existing mapping (`provider_unavailable` when `retryable`, else
      `error_code`) and `RetryPolicy` (RF-27).
    messages:
      makeIntegrationCallback:
        $ref: '#/components/messages/MakeIntegrationCallback'

  quoteRequestEmail:
    address: quote-request
    servers:
      - $ref: '#/servers/chatwootEmailInbox'
    description: >
      CT-03. One e-mail conversation per quote request (marker
      `additional_attributes.scansolo_thread = quote_request`), created by
      `ScanSolo::Quote::RequestService` after the qualification completes with next action
      `proposta` (RF-12). The same conversation carries the correction e-mail (RF-18).
      Negotiation notifications use their own conversation (marker
      `negotiation_notification`, RF-37). The manual resend (RF-56, CT-12) posts a new
      message in the same request conversation. Messages are created only after commit (RNF-01).
    messages:
      quoteRequest:
        $ref: '#/components/messages/QuoteRequestEmail'
      quoteCorrection:
        $ref: '#/components/messages/QuoteCorrectionEmail'
      negotiationNotification:
        $ref: '#/components/messages/NegotiationNotificationEmail'

  quoteReplyEmail:
    address: quote-reply
    servers:
      - $ref: '#/servers/chatwootEmailInbox'
    description: >
      CT-04. Reply from the commercial team received in the quote inbox. Routed by the
      listener (before the eligibility gate) to `ScanSolo::QuoteReplyJob` →
      `ScanSolo::Quote::ReplyProcessor`: thread of an open request → deterministic block
      read (RF-17/RF-18); thread of a `replied` request → pending `late_reply` (RF-23);
      thread of a negotiation notification → ignored (RF-42); any other thread → pending
      `unmatched` (RF-19). No LLM (RF-21); no new cron (RNF-03).
    messages:
      quoteReply:
        $ref: '#/components/messages/QuoteReplyEmail'

  negotiationRequested:
    address: negotiation.requested
    servers:
      - $ref: '#/servers/chatwootEventBus'
    description: >
      CT-07. Published by `ScanSolo::Notifications::Publisher` after the commit of the
      negotiation transaction (RF-35, RF-37). Every registered adapter
      (`Publisher::ADAPTERS`, default `EmailAdapter`) receives the identical payload and
      answers success/failure; a failure becomes an `AuditEvent`
      `negotiation.notification_failed` and never undoes the negotiation (RF-39, RF-41).
    messages:
      negotiationRequested:
        $ref: '#/components/messages/NegotiationRequested'

  nativeMessageCreated:
    address: message.created
    servers:
      - $ref: '#/servers/chatwootEventBus'
    description: >
      CHANGED. Before the eligibility gate: delivery reconciliation for template origins
      (`cadence`, `proposal`, `manual_lead`) and routing of `incoming` messages of the
      configured quote inbox to `QuoteReplyJob` (RF-16, RF-17). Eligible incoming: after
      bootstrap (origin written on creation, RF-02) and the Novo Lead rule, the pending
      cadence attempt is interrupted — at most one per cycle, the cycle restarting on any
      non-private outgoing message (RF-43) — then the AI turn is enqueued. Outgoing
      messages carrying `scansolo_origin` never count as takeover.
    messages:
      nativeMessageEvent:
        $ref: '#/components/messages/NativeMessageEvent'

  nativeMessageUpdated:
    address: message.updated
    servers:
      - $ref: '#/servers/chatwootEventBus'
    description: >
      CHANGED. Delivery reconciliation: proposal message accepted → version `sent` →
      `proposta_enviada` + post-proposal cadence + one follow-up after commit (RF-30,
      RF-31); a proposal message turning `failed` after `sent` → version `failed` + audit,
      stage kept (RF-30); a `manual_lead` template turning `failed` → audit shown on the
      lead screen (RF-08).
    messages:
      nativeMessageEvent:
        $ref: '#/components/messages/NativeMessageEvent'

operations:
  sendMakeIntegrationRequest:
    action: send
    channel:
      $ref: '#/channels/makeIntegrationRequest'
    summary: >
      `ScanSolo::Proposal::GenerateService` (only for a validated quote reply, RF-25) →
      `MakeProvider` → `Make::OutboundRequestService`, after commit. `idempotency_key` =
      `correlation_id` = the version's `generate_correlation_id`.
    messages:
      - $ref: '#/channels/makeIntegrationRequest/messages/makeIntegrationRequest'

  receiveMakeIntegrationCallback:
    action: receive
    channel:
      $ref: '#/channels/makeIntegrationCallback'
    summary: Apply a verified Make result; schedule the WhatsApp delivery on success (RF-26, RF-29).
    messages:
      - $ref: '#/channels/makeIntegrationCallback/messages/makeIntegrationCallback'

  sendQuoteEmails:
    action: send
    channel:
      $ref: '#/channels/quoteRequestEmail'
    summary: Quote request (RF-12) and its manual resend (RF-56), correction (RF-18) and negotiation notification (RF-37) e-mails.
    messages:
      - $ref: '#/channels/quoteRequestEmail/messages/quoteRequest'
      - $ref: '#/channels/quoteRequestEmail/messages/quoteCorrection'
      - $ref: '#/channels/quoteRequestEmail/messages/negotiationNotification'

  receiveQuoteReply:
    action: receive
    channel:
      $ref: '#/channels/quoteReplyEmail'
    summary: Deterministic read of the CT-04 block or pending registration.
    messages:
      - $ref: '#/channels/quoteReplyEmail/messages/quoteReply'

  publishNegotiationRequested:
    action: send
    channel:
      $ref: '#/channels/negotiationRequested'
    summary: Negotiation notification through the replaceable adapter interface (RF-41).
    messages:
      - $ref: '#/channels/negotiationRequested/messages/negotiationRequested'

  consumeNativeMessageCreated:
    action: receive
    channel:
      $ref: '#/channels/nativeMessageCreated'
    summary: Listener entry point (RF-02, RF-16, RF-43).
    messages:
      - $ref: '#/channels/nativeMessageCreated/messages/nativeMessageEvent'

  consumeNativeMessageUpdated:
    action: receive
    channel:
      $ref: '#/channels/nativeMessageUpdated'
    summary: Delivery reconciliation (RF-08, RF-30, RF-31).
    messages:
      - $ref: '#/channels/nativeMessageUpdated/messages/nativeMessageEvent'

components:
  securitySchemes:
    makeOutboundAuth:
      type: httpApiKey
      in: header
      name: Authorization
      description: "`Bearer <scan_solo.make.secret>`; server-side only."
    makeInboundSignature:
      type: httpApiKey
      in: header
      name: X-Make-Signature
      description: HMAC-SHA256 hex of the raw body with `scan_solo.make.inbound_signing_secret`.

  messages:
    MakeIntegrationRequest:
      name: MakeIntegrationRequest
      title: Outbound Make proposal generation request (CT-05)
      contentType: application/json
      headers:
        type: object
        required: [Authorization, X-Idempotency-Key]
        properties:
          Authorization:
            type: string
            pattern: '^Bearer .+$'
          X-Idempotency-Key:
            type: string
      payload:
        $ref: '#/components/schemas/MakeIntegrationRequestPayload'
      examples:
        - name: generateWithCommercial
          summary: Payload used by PLAN T38 ("Run once" test of the adapted Entrada).
          payload:
            correlation_id: 2f0b7d3e-6c1a-4f5e-9b1d-0a8e2c4d6f10
            idempotency_key: 2f0b7d3e-6c1a-4f5e-9b1d-0a8e2c4d6f10
            action: proposal.generate
            account_id: 1
            opportunity_id: 42
            proposal_version_id: 77
            proposal_number: SS-2026-000077
            qualification:
              empresa: Construtora Exemplo
              cidade_uf: Rio de Janeiro / RJ
              area: 800 m²
              nome: Ana Souza
              telefone: "+5521999990000"
              projeto: Hospital Central
            commercial:
              total_value: 12500.0
              total_value_in_words: doze mil e quinhentos reais
              currency: BRL
              schedule: 2 diárias, início em até 10 dias úteis
              scope: Varredura GPR em 800 m² com relatório técnico
              payment_terms: 50% na aprovação e 50% na entrega do relatório
              notes: Mobilização inclusa
              quote_request_id: 9
            requested_by_user_id: null
            requested_at: "2026-10-01T15:00:00-03:00"

    MakeIntegrationCallback:
      name: MakeIntegrationCallback
      title: Inbound Make callback (CT-06, schema unchanged)
      contentType: application/json
      headers:
        type: object
        required: [X-Make-Signature]
        properties:
          X-Make-Signature:
            type: string
      payload:
        $ref: '#/components/schemas/MakeIntegrationCallbackPayload'

    QuoteRequestEmail:
      name: QuoteRequestEmail
      title: Quote request e-mail to the commercial team (CT-03; RF-12, RF-13)
      contentType: text/html
      payload:
        $ref: '#/components/schemas/QuoteRequestEmailPayload'

    QuoteCorrectionEmail:
      name: QuoteCorrectionEmail
      title: Correction request in the same quote thread (CT-03; RF-18)
      contentType: text/html
      payload:
        $ref: '#/components/schemas/QuoteCorrectionEmailPayload'

    NegotiationNotificationEmail:
      name: NegotiationNotificationEmail
      title: Default e-mail adapter rendering of CT-07 (RF-37)
      contentType: text/html
      payload:
        $ref: '#/components/schemas/NegotiationNotificationEmailPayload'

    QuoteReplyEmail:
      name: QuoteReplyEmail
      title: Reply received in the quote inbox (CT-04)
      contentType: text/plain
      payload:
        $ref: '#/components/schemas/QuoteReplyEmailPayload'

    NegotiationRequested:
      name: NegotiationRequested
      title: negotiation.requested (CT-07)
      contentType: application/x-ruby-object
      payload:
        $ref: '#/components/schemas/NegotiationRequestedPayload'

    NativeMessageEvent:
      name: NativeMessageEvent
      title: Native Chatwoot message event (internal)
      contentType: application/x-ruby-object
      payload:
        $ref: '#/components/schemas/NativeMessageEventPayload'

  schemas:
    QualificationValue:
      type: [string, number, boolean]

    MakeQualification:
      type: object
      description: >
        v1.3.0 fixed canonical key set (present-only, never null) + `projeto` (value of
        `cliente_final`, only when present). Built by
        `ScanSolo::Qualification::FieldResolver#make_qualification`.
      propertyNames:
        enum: [empresa, endereco_obra, cidade_uf, tipo_intervencao, area, profundidade, prazo_desejado, email, nome, telefone, projeto]
      additionalProperties:
        $ref: '#/components/schemas/QualificationValue'

    Commercial:
      type: object
      description: >
        NEW (CT-05). Data validated from the commercial reply (CT-04, RF-17), stored in
        `scan_solo_quote_requests.commercial` and read by `MakeProvider` from
        `proposal_version.quote_request`. Never produced by an LLM (RF-21).
      required: [total_value, total_value_in_words, currency, schedule, scope, payment_terms, quote_request_id]
      additionalProperties: false
      properties:
        total_value:
          type: number
          exclusiveMinimum: 0
          description: "\"Valor total\" parsed with `.` as thousands and `,` as decimal separator."
        total_value_in_words:
          type: string
          minLength: 1
          description: >
            pt-BR amount in words generated deterministically by
            `ScanSolo::Quote::AmountInWords` (RF-47, CT-05 v1.3); used by Make as received.
        currency:
          type: string
          enum: [BRL]
        schedule:
          type: string
          minLength: 1
          description: '"Prazo/cronograma".'
        scope:
          type: string
          minLength: 1
          description: '"Escopo/atividades".'
        payment_terms:
          type: string
          minLength: 1
          description: '"Condições de pagamento".'
        notes:
          type: string
          minLength: 1
          description: '"Observações comerciais" — omitted when empty.'
        quote_request_id:
          type: integer
          format: int64

    MakeIntegrationRequestPayload:
      type: object
      required: [correlation_id, idempotency_key, action, account_id, opportunity_id, proposal_version_id, proposal_number, qualification, commercial, requested_by_user_id, requested_at]
      properties:
        correlation_id:
          type: string
          format: uuid
          description: The version's `generate_correlation_id` (new per generation, RF-24).
        idempotency_key:
          type: string
          description: Equals `correlation_id`.
        action:
          type: string
          enum: [proposal.generate]
          description: Only `proposal.generate` is emitted (RF-55).
        account_id:
          type: integer
          format: int64
        opportunity_id:
          type: integer
          format: int64
        proposal_version_id:
          type: integer
          format: int64
          description: Make idempotency key in `ScanSOLO_Proposta_Map` as `pv_{id}` (RF-50).
        proposal_number:
          type: string
          pattern: '^SS-\d{4}-\d{6}$'
          description: NEW — generated by Rails at version creation, unique (RF-26).
        qualification:
          $ref: '#/components/schemas/MakeQualification'
        commercial:
          $ref: '#/components/schemas/Commercial'
        requested_by_user_id:
          type: [integer, "null"]
          format: int64
          description: Null for the automatic generation from a validated reply.
        requested_at:
          type: string
          format: date-time

    MakeIntegrationCallbackPayload:
      type: object
      required: [correlation_id, idempotency_key, action, status]
      properties:
        correlation_id:
          type: string
          minLength: 1
        idempotency_key:
          type: string
          minLength: 1
        action:
          type: string
          enum: [proposal.generate, proposal.send]
          description: "`proposal.send` accepted only for historical callbacks (RF-55, RNF-10)."
        status:
          type: string
          enum: [success, failure]
        result:
          oneOf:
            - $ref: '#/components/schemas/ProposalGeneratedResult'
            - $ref: '#/components/schemas/ProposalSendConfirmedResult'
            - $ref: '#/components/schemas/ProposalFailureResult'

    ProposalGeneratedResult:
      type: object
      required: [proposal_version_id, artifact_url, total_value, currency, valid_until]
      properties:
        proposal_version_id:
          type: integer
          format: int64
        artifact_url:
          type: string
          format: uri
          description: >
            CHANGED semantics (RF-48) — HTTPS URL of the final PDF, downloadable by Rails at
            callback time with `Content-Type: application/pdf` (`SafeFetch`). Download
            failure → version `failed`/`artifact_download_failed` (RF-32). Never sent to
            the customer; need not be permanent.
        total_value:
          type: number
          description: Must equal the request's `commercial.total_value` (RF-48); written to `value`.
        currency:
          type: string
          minLength: 3
          maxLength: 3
        valid_until:
          type: string
          format: date-time
          description: CHANGED semantics — computed by Make from `validade_dias` and now persisted (RF-26).

    ProposalSendConfirmedResult:
      type: object
      description: Historical only (legacy `proposal.send`); still accepted, never requested by the new flow.
      required: [proposal_version_id, sent_at, transport_message_id]
      properties:
        proposal_version_id:
          type: integer
          format: int64
        sent_at:
          type: string
          format: date-time
        transport_message_id:
          type: string

    ProposalFailureResult:
      type: object
      description: >
        RF-49 — sent by every Docs/Drive/export error handler of the Entrada, body built by
        a JSON serializer ("Create JSON"), signed with `X-Make-Signature`.
      required: [proposal_version_id, error_code, error_message, retryable]
      properties:
        proposal_version_id:
          type: integer
          format: int64
        error_code:
          type: string
          examples: [docs_copy_failed, drive_export_failed]
        error_message:
          type: string
        retryable:
          type: boolean

    EmailAddress:
      type: string
      format: email

    QuoteRequestEmailPayload:
      type: object
      description: >
        Sections in this order (RF-13): (1) identification — opportunity id, contact name,
        company, phone, e-mail, origin, owner, stage, Chatwoot WhatsApp conversation link
        `<FRONTEND_URL>/app/accounts/<account_id>/conversations/<display_id>`; (2) every
        catalog field with status ≠ `faltante`, pt-BR label, `inferido` marked
        "(a confirmar)"; (3) the empty CT-04 block with filling instructions. A manual resend
        (RF-56) recomposes the same content in the same thread. HTML keeps one
        label/field per line. No token, secret or internal API URL (RNF-07).
      required: [from, to, subject, message_id, html_body, text_body]
      properties:
        from:
          $ref: '#/components/schemas/EmailAddress'
          description: E-mail of the quote inbox channel.
        to:
          type: array
          minItems: 1
          maxItems: 1
          description: Published `quote_recipient_email` (RF-54; initial value `comercial@scansolo.com.br`).
          items:
            $ref: '#/components/schemas/EmailAddress'
        subject:
          type: string
          pattern: '^Solicitação de orçamento #\d+ — .+$'
        message_id:
          type: string
          pattern: '^<conversation/[0-9a-f-]+/messages/\d+@.+>$'
          description: Native Message-ID used for threading the reply.
        html_body:
          type: string
        text_body:
          type: string

    QuoteCorrectionEmailPayload:
      type: object
      description: >
        Same thread as the request (RF-18, RF-20). Lists each problematic field by its
        CT-04 label and repeats the empty block. Subject is the thread subject (native
        "Re:" prefix).
      required: [from, to, subject, html_body, text_body, problem_labels]
      properties:
        from:
          $ref: '#/components/schemas/EmailAddress'
        to:
          type: array
          minItems: 1
          maxItems: 1
          description: Published `quote_recipient_email` (RF-54; initial value `comercial@scansolo.com.br`).
          items:
            $ref: '#/components/schemas/EmailAddress'
        subject:
          type: string
        html_body:
          type: string
        text_body:
          type: string
        problem_labels:
          type: array
          minItems: 1
          items:
            type: string
            enum: [Valor total, Prazo/cronograma, Escopo/atividades, Condições de pagamento]

    NegotiationNotificationEmailPayload:
      type: object
      description: >
        Rendering of `NegotiationRequestedPayload` by the default adapter, in its own
        conversation (marker `negotiation_notification`): name, company, phone,
        opportunity (id and stage), conversation link, request summary, current proposal
        (version, number, status, PDF link in Chatwoot), current value or "sem proposta",
        and the last 3 chat messages (RF-37). Replies to it are ignored (RF-42).
      required: [from, to, subject, html_body, text_body]
      properties:
        from:
          $ref: '#/components/schemas/EmailAddress'
        to:
          type: array
          minItems: 1
          maxItems: 1
          description: Published `quote_recipient_email` (RF-54; initial value `comercial@scansolo.com.br`).
          items:
            $ref: '#/components/schemas/EmailAddress'
        subject:
          type: string
        html_body:
          type: string
        text_body:
          type: string

    QuoteReplyEmailPayload:
      type: object
      description: >
        Native incoming e-mail message. `content` is the full reply text INCLUDING the
        quoted original (`app/presenters/mail_presenter.rb:42-55`); when empty, the HTML
        body is converted to text keeping line breaks. Read rules (CT-04): lines starting
        with `>` ignored; the quoted empty block ignored; the first block (top-down) with at
        least one filled label is used; labels "Valor total", "Prazo/cronograma",
        "Escopo/atividades", "Condições de pagamento" (required) and
        "Observações comerciais" (optional) are matched tolerating case, accents,
        collapsed spaces, extra blank lines, simple HTML formatting (bold, bullets) and `:`
        with or without spaces; delimiters `=== RESPOSTA DO ORÇAMENTO ===` / `=== FIM ===`
        help but are optional; each value runs to the next label, the end delimiter or the
        start of the quote, may span lines and is trimmed. Outcome → `ParsedQuoteBlock`
        (valid) or the list of problems (correction e-mail).
      required: [message_id, conversation_id, from, subject, content]
      properties:
        message_id:
          type: integer
          format: int64
        conversation_id:
          type: integer
          format: int64
        from:
          $ref: '#/components/schemas/EmailAddress'
        subject:
          type: [string, "null"]
        in_reply_to:
          type: [string, "null"]
        references:
          type: [string, "null"]
        content:
          type: string

    ParsedQuoteBlock:
      type: object
      description: Valid result of `ScanSolo::Quote::ResponseBlockParser` (RF-17); becomes `Commercial`.
      required: [total_value, schedule, scope, payment_terms]
      additionalProperties: false
      properties:
        total_value:
          type: number
          exclusiveMinimum: 0
          description: >
            From `R$`? + `\d{1,3}(\.\d{3})*(,\d{2})?` or `\d+(,\d{2})?`; `12500.00` (dot
            decimal) is illegible (RF-18).
        schedule:
          type: string
          minLength: 1
        scope:
          type: string
          minLength: 1
        payment_terms:
          type: string
          minLength: 1
        notes:
          type: string
          minLength: 1

    NegotiationContact:
      type: object
      required: [name, company, phone]
      properties:
        name:
          type: [string, "null"]
        company:
          type: [string, "null"]
        phone:
          type: [string, "null"]

    NegotiationProposal:
      type: object
      required: [version_number, proposal_number, status, document_url]
      properties:
        version_number:
          type: integer
        proposal_number:
          type: [string, "null"]
        status:
          type: string
          enum: [generating, generated, approved, sent, failed]
        document_url:
          type: [string, "null"]
          format: uri

    NegotiationCurrentValue:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
        currency:
          type: string
          minLength: 3
          maxLength: 3

    NegotiationRecentMessage:
      type: object
      required: [sender, content, created_at]
      properties:
        sender:
          type: string
          enum: [customer, agent]
        content:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time

    NegotiationRequestedPayload:
      type: object
      description: >
        CT-07, built by `ScanSolo::Notifications::NegotiationPayload` and delivered
        unchanged to every adapter (RF-41).
      required: [account_id, opportunity_id, conversation_id, conversation_url, contact, stage, request_summary, proposal, current_value, recent_messages, correlation_id]
      additionalProperties: false
      properties:
        account_id:
          type: integer
          format: int64
        opportunity_id:
          type: integer
          format: int64
        conversation_id:
          type: integer
          format: int64
        conversation_url:
          type: string
          format: uri
          description: "`<FRONTEND_URL>/app/accounts/<account_id>/conversations/<display_id>`."
        contact:
          $ref: '#/components/schemas/NegotiationContact'
        stage:
          type: string
          enum: [negociacao]
          description: The stage after the negotiation flow (RF-35).
        request_summary:
          type: string
          description: Content of the customer message that triggered the signal.
        proposal:
          oneOf:
            - $ref: '#/components/schemas/NegotiationProposal'
            - type: "null"
        current_value:
          oneOf:
            - $ref: '#/components/schemas/NegotiationCurrentValue'
            - type: "null"
        recent_messages:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/NegotiationRecentMessage'
        correlation_id:
          type: string
          description: Correlation id of the AI turn that raised the signal.

    NativeMessageEventPayload:
      type: object
      required: [message]
      properties:
        message:
          type: object
          required: [id, account_id, conversation_id, inbox_id, message_type, private, sender_type, status, source_id, created_at]
          properties:
            id:
              type: integer
              format: int64
            account_id:
              type: integer
              format: int64
            conversation_id:
              type: integer
              format: int64
            inbox_id:
              type: integer
              format: int64
            message_type:
              type: string
              enum: [incoming, outgoing, activity, template]
            private:
              type: boolean
            sender_type:
              type: [string, "null"]
              enum: [User, AgentBot, Contact, null]
            status:
              type: string
              enum: [sent, delivered, read, failed]
            source_id:
              type: [string, "null"]
            external_error:
              type: [string, "null"]
            scansolo_origin:
              type: [string, "null"]
              enum: [ai, cadence, proposal, manual_lead, quote_notice, proposal_follow_up, null]
              description: >
                CHANGED (additive). `manual_lead` = initial template (RF-07, reconciled for
                RF-08); `quote_notice` = customer notice of RF-53, exact text "Recebi todas as informações, obrigado! Nosso comercial já está preparando seu orçamento. Assim que estiver pronto, envio por aqui.", sent once
                per request and never repeated;
                `proposal_follow_up` = post-proposal follow-up (RF-31). Any non-null value
                excludes the message from takeover.
            created_at:
              type: string
              format: date-time
